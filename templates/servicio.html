<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Servicio</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; max-width: 300px; background: #fff; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Detalle del Servicio</h2>
        <!-- Usando las claves que pide el enunciado -->
        <div class="item"><span>Nombre:</span><span>{{ Nombre }}</span></div>
        <div class="item"><span>Valor:$</span><span>{{ Valor }}</span></div>
    </div>
    <br>
    <a href="/">Volver al Inicio</a>
</body>
</html>
